<text class="tick" x="710.0" y="476" text-anchor="middle">14</text>
<line class="axis" x1="78" y1="46" x2="78" y2="458"/>
<line class="axis" x1="78" y1="458" x2="710" y2="458"/>
<text class="label" x="394" y="506" text-anchor="middle">elapsed time (seconds)</text>
<text class="label" x="18" y="252" text-anchor="middle" transform="rotate(-90 18 252)">p99 latency (microseconds)</text>
